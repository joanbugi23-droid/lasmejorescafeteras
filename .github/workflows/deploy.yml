name: Actualizar precios y desplegar

on:
  push:
    branches: [main]
  schedule:
    # 06:00 UTC todos los días (07-08h hora española) — refresca precios/disponibilidad
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Rellenar catálogo desde Amazon Creators API (SearchItems + GetItems)
        env:
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: npm run fetch-catalog

      - name: Guardar cache de catálogo en el repositorio
        run: |
          if ! git diff --quiet -- src/data/catalog.generated.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/catalog.generated.json
            git commit -m "chore: actualizar catalogo de productos [skip ci]"
            git push
          else
            echo "Sin cambios en el catálogo."
          fi

      - name: Construir sitio estático
        run: npx astro build

      - name: Crear proyecto de Cloudflare Pages (si no existe)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create lasmejorescafeteras --production-branch=main || true

      - name: Desplegar a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lasmejorescafeteras --commit-dirty=true
